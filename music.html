<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自作オリジナル曲 🎶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#3b2a4a;--paper:#fff7fb;--bubble:#fff;--pink:#ff7ec0;--grape:#9d7bff;--sky:#5ec8ff;--mint:#67e6c2;--lemon:#ffd84d;--tangerine:#ff9a52;--shadow:rgba(157,123,255,.28)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);
    background:radial-gradient(circle at 12% 8%,#ffe0f2 0,transparent 38%),radial-gradient(circle at 88% 4%,#e2e0ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#d6f7ff 0,transparent 45%),var(--paper);
    min-height:100vh;overflow-x:hidden}
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .sky i{position:absolute;display:block;animation:drift linear infinite;opacity:.45}
  @keyframes drift{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
  .sh-ring{border:2.5px solid var(--c);border-radius:50%}
  .sh-sq{border:2.5px solid var(--c)}
  .sh-dia{border:2.5px solid var(--c);transform:rotate(45deg)}
  .sh-tri{width:0!important;height:0!important;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:22px solid var(--c);background:transparent}
  .sh-plus{position:relative}
  .sh-plus::before,.sh-plus::after{content:"";position:absolute;background:var(--c);border-radius:2px}
  .sh-plus::before{left:50%;top:0;width:2.5px;height:100%;transform:translateX(-50%)}
  .sh-plus::after{top:50%;left:0;height:2.5px;width:100%;transform:translateY(-50%)}
  .sh-hex{border:2.5px solid var(--c);border-radius:4px;transform:rotate(30deg)}
  @media(prefers-reduced-motion:reduce){.sky i{animation:none;display:none}}

  .menubtn{position:fixed;top:16px;right:16px;z-index:30;width:46px;height:46px;border:none;cursor:pointer;
    background:#fff;border-radius:14px;box-shadow:0 5px 14px var(--shadow);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px}
  .menubtn span{width:22px;height:2.6px;background:var(--grape);border-radius:2px;transition:.25s}
  .menubtn.open span:nth-child(1){transform:translateY(7.6px) rotate(45deg)}
  .menubtn.open span:nth-child(2){opacity:0}
  .menubtn.open span:nth-child(3){transform:translateY(-7.6px) rotate(-45deg)}
  .drawer{position:fixed;inset:0;z-index:25;background:rgba(59,42,74,.32);opacity:0;pointer-events:none;transition:.25s}
  .drawer.open{opacity:1;pointer-events:auto}
  .panel{position:absolute;top:0;right:0;height:100%;width:min(78vw,300px);background:var(--paper);
    box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);
    padding:74px 20px 30px;overflow-y:auto}
  .drawer.open .panel{transform:translateX(0)}
  .panel a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:700;
    padding:15px 16px;border-radius:14px;background:#fff;box-shadow:0 4px 12px var(--shadow);margin-bottom:12px;font-size:1rem}
  .panel a .e{font-size:1.3rem}

  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 22px 80px}
  .back{display:inline-flex;align-items:center;gap:6px;margin-top:20px;text-decoration:none;font-weight:700;font-size:1rem;color:#7048d8;background:#fff;padding:11px 18px;border-radius:99px;box-shadow:0 4px 0 var(--shadow)}
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  header{text-align:center;padding:30px 0 10px}
  .badge{display:inline-block;font-size:.88rem;letter-spacing:.1em;background:#fff;border:2px solid var(--mint);color:#0d8168;padding:7px 17px;border-radius:999px;font-weight:700;box-shadow:0 4px 0 var(--shadow)}
  h1{font-family:'Mochiy Pop One',sans-serif;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.15;margin:20px 0 10px;
    background:linear-gradient(100deg,var(--mint),var(--sky),var(--grape),var(--pink));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 9s ease infinite}
  @keyframes hue{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
  .tagline{font-size:clamp(1.02rem,2.8vw,1.16rem);font-weight:700;color:#6a5a7a;max-width:42ch;margin:0 auto;line-height:1.75}
  .tagline b{color:var(--pink)}
  .note{font-size:.85rem;font-weight:700;color:#8d7ba3;margin-top:10px;line-height:1.7}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;margin-top:34px}
  .scard{background:var(--bubble);border-radius:24px;padding:22px 22px 20px;box-shadow:0 10px 26px var(--shadow);border:3px solid #fff;position:relative}
  .scardtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .num{font-family:'Mochiy Pop One',sans-serif;font-size:1.3rem;color:var(--grape);opacity:.55}
  .stat{font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:99px;background:#e2fbf3;color:#0d8168;white-space:nowrap}
  .lyric{font-size:1.04rem;line-height:1.9;color:var(--ink);font-weight:700;white-space:pre-wrap;border-left:3px solid #f1edff;padding-left:14px}
  .lockrow{margin-top:16px;font-size:.78rem;font-weight:700;color:#a99cb8;display:flex;align-items:center;gap:5px}

  .scard.next{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#fff,#f6f2ff);border-style:dashed;border-color:#e4d9ff}
  .scard.next .num{font-size:1.6rem}
  .nextnote{font-size:.85rem;color:#9a89ad;line-height:1.7;margin-top:8px}

  footer{text-align:center;margin-top:70px;color:#9a89ad;font-size:.9rem;line-height:1.9}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>

<button class="menubtn" id="menubtn" aria-label="メニュー"><span></span><span></span><span></span></button>
<div class="drawer" id="drawer">
  <nav class="panel">
    <a href="games.html"><span class="e">🎮</span>個人開発ゲーム</a>
    <a href="music.html"><span class="e">🎶</span>自作オリジナル曲</a>
    <a href="gallery.html"><span class="e">🎨</span>日常ゾーン</a>
    <a href="index.html#work"><span class="e">💼</span>お仕事はこちら</a>
  </nav>
</div>

<div class="wrap">
  <a class="back" href="index.html">← トップへもどる</a>
  <header>
    <span class="badge">作詞ぜんぶ自作 × AI音楽</span>
    <h1>自作オリジナル曲</h1>
    <p class="tagline">レコーディングとMV制作、のんびりだけどコツコツ進行中。<br><b>2026年10月ごろ</b>から順次お披露目予定！</p>
    <p class="note">※ タイトル・音源・曲順は公開までひみつです。歌詞の一部だけ先出し中。今後も曲は増えていきます。</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>つくった人：らむね あい 🌈<br>作詞はぜんぶ自分の言葉で書いています。</footer>
</div>

<script>
  // 曲を増やすときはこの配列に { lyric:`...` } を追加するだけでOK
  const songs=[
    {lyric:`信じられなかった\nこんな日が来るなんて\nドラえもんの世界が\n現実になっちゃった！`},
    {lyric:`振って！振って！\nサイリウム！\nもっと！もっと！\n高くして！\n優勝！優勝！\n圧倒的タイパ！\nコスパじゃ測れない！\n大優勝！`},
    {lyric:`AI×あい×愛×アイ\n（AI！あい！愛！アイ！）\n∞のトキメキクリエイター\nI'm Ai♡`},
    {lyric:`「え・え・え、AI三銃士を連れてきたよ。」\n「え、AI三銃士？」\n「相談の専門家〜？chatGPT！」\n「結論からいうね。👉それ、正解」\n「画像の専門家〜？Gemini！」\n「めちゃくちゃかっこいいですね！鳥肌立ちました！」\n「コーディング、スキルなど長文処理の専門家〜？Claude！」\n「こんばんは、夜更かしさん。」\n＼３人合わせて！最強AI三銃士★／`},
    {lyric:`ド・パ・ミン （Hey！！！）\nチ・シ・リョウ （Hey！！！）\nド・パ・ミン （Hey！！）\nチ・シ・リョウ （Hey！！！）\n回せ回せ ガチャ回せ〜！！！\n生成しまくり 神曲出まくり～！！！（作りまくり～！！）`},
    {lyric:`ずっとしまってた　小さな宝物\n見ないふりしてた　ふたをそっと開けて\n透き通るわたしの色　あぁ\nこのままでいいんだ`},
    {lyric:`むいてないなあって思いながら\nなぜか 諦められなかった\n何度転んでも立ち上がって\nその強さが 自信になった`},
    {lyric:`天塩にかけた\nオリジナルお花畑！\nお気に入りのおもちゃ\nもってきてね！\nパスキーは え・が・お！\n\nよ・よ・ようこそ！\n夢のおもちゃガーデンへ！（WOW！)`},
    {lyric:`喉につかえた願い事\n一年に一度逢えるなんて\nずるいよ　織姫と彦星`},
    {lyric:`ずっと全力ダイスキ発信しちゃうから！\n予防線も保険も置き忘れるくらいでちょうどいい！\n心の殻なんて熱で溶かしちゃうよ！\n（いいよー！）\n明るい未来はこれからでしょ！\n(Yeah! !)\nとびっきりの夢見よ！\n(Foooo! !)`},
    {lyric:`理想論だと笑えばいい\nくだらないって決めればいい\n誰かが作った物差しで\n僕を測れるわけがない`},
  ];

  const grid=document.getElementById('grid');
  songs.forEach((s,i)=>{
    const el=document.createElement('article');
    el.className='scard';
    const num=String(i+1).padStart(2,'0');
    el.innerHTML=`
      <div class="scardtop">
        <span class="num">${num}</span>
        <span class="stat">REC・MV制作中</span>
      </div>
      <blockquote class="lyric">${s.lyric}</blockquote>
      <div class="lockrow">🔒 タイトル・音源は公開までひみつ</div>`;
    grid.appendChild(el);
  });
  const nextEl=document.createElement('article');
  nextEl.className='scard next';
  nextEl.innerHTML=`<span class="num">？</span><p class="nextnote">この続きもまだまだ増える予定…🎶<br>気長にお待ちください</p>`;
  grid.appendChild(nextEl);

  const sky=document.getElementById('sky');
  const shapes=['sh-ring','sh-sq','sh-dia','sh-tri','sh-plus','sh-hex'];
  const colors=['#ff7ec0','#9d7bff','#5ec8ff','#67e6c2','#ffd84d','#ff9a52'];
  for(let n=0;n<18;n++){
    const el=document.createElement('i');
    const kind=shapes[Math.floor(Math.random()*shapes.length)];
    el.className=kind;
    el.style.setProperty('--c',colors[Math.floor(Math.random()*colors.length)]);
    if(kind!=='sh-tri'){const s=14+Math.random()*28;el.style.width=s+'px';el.style.height=s+'px';}
    el.style.left=Math.random()*100+'vw';
    const dur=12+Math.random()*14;el.style.animationDuration=dur+'s';el.style.animationDelay=(-Math.random()*dur)+'s';
    sky.appendChild(el);
  }
  const mb=document.getElementById('menubtn'), dr=document.getElementById('drawer');
  function toggle(){mb.classList.toggle('open');dr.classList.toggle('open');}
  mb.addEventListener('click',toggle);
  dr.addEventListener('click',e=>{if(e.target===dr)toggle();});
  dr.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>toggle()));
</script>
</body>
</html>
